<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GU9 Admin</title>
<style>
:root{
  /* GU9 front brand: ink/navy + crimson + gold */
  --bg:#02060e; --panel:#081227; --panel2:#0b1730; --panel3:#122142;
  --line:rgba(255,255,255,.08); --line2:rgba(226,191,106,.28); --txt:#ffffff; --txt2:rgba(255,255,255,.7); --txt3:rgba(255,255,255,.45);
  --gold:#e2bf6a; --gold2:#c9a24b; --gold3:#eed79a; --green:#3dd68c; --red:#de1e31; --crimson:#de1e31; --blue:#2a5ba8;
  --navy:#08193a; --navy2:#0b2857;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:
  radial-gradient(900px 520px at 18% -8%,rgba(222,30,49,.18),transparent 55%),
  radial-gradient(1000px 600px at 82% -12%,rgba(42,91,168,.22),transparent 58%),
  var(--bg);
  color:var(--txt);font:14px/1.5 Inter,-apple-system,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(8,25,58,.97),rgba(2,6,14,.94));position:relative;backdrop-filter:blur(10px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(226,191,106,.55),rgba(222,30,49,.4),transparent)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.brand img{width:28px;height:30px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(245,195,82,.4))}
.spacer{flex:1}
.tabs{display:flex;gap:4px;padding:10px 18px 0}
.tab{padding:9px 14px;border-radius:12px 12px 0 0;color:var(--txt3);cursor:pointer;font-weight:600;font-size:13.5px}
.tab.on{color:var(--gold);background:var(--panel);border:1px solid rgba(226,191,106,.25);border-bottom:none;box-shadow:0 -1px 0 rgba(226,191,106,.15) inset}
.body{flex:1;padding:16px 18px 30px}
.card{background:linear-gradient(180deg,rgba(226,191,106,.04),rgba(255,255,255,.01)),var(--panel);
  border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:14px;box-shadow:0 12px 36px rgba(0,0,0,.45)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.kpi .v{font-size:24px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--txt3);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
th{color:var(--txt3);font-size:12px;font-weight:600}
tr:hover td{background:rgba(255,255,255,.03)}
input,select{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;
  padding:8px 10px;font-size:13.5px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,195,82,.12)}
.btn{border:none;cursor:pointer;padding:0 14px;height:36px;border-radius:10px;font-weight:600;font-size:13.5px;
  background:var(--panel3);color:#fff}
.btn.gold{background:linear-gradient(180deg,#eed79a,var(--gold2));color:#050c1a}
.btn.red{background:linear-gradient(180deg,#f03a4c,var(--crimson))}
.btn.green{background:linear-gradient(180deg,#3ce08a,#12a35c)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt2)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--txt3)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.tag.on{background:rgba(46,204,113,.15);color:#7fe3a8}
.tag.off{background:rgba(255,90,95,.15);color:#ffa4a7}
.tag.vip{background:rgba(245,195,82,.16);color:var(--gold)}
.tag.wait{background:rgba(245,195,82,.16);color:var(--gold)}
.tag.run{background:rgba(42,91,168,.22);color:#9ecbff}
.tag.done{background:rgba(46,204,113,.15);color:#7fe3a8}
.tag.bad{background:rgba(255,90,95,.15);color:#ffa4a7}
.sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.card+.card{margin-top:12px}
.mask{position:fixed;inset:0;background:rgba(3,6,10,.78);backdrop-filter:blur(3px);display:flex;
  align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{width:100%;max-width:520px;background:linear-gradient(180deg,#0b2857,#081227);border:1px solid rgba(226,191,106,.3);
  border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.65);overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:14px 18px;overflow:auto}
.mf{padding:12px 18px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--txt3);margin-bottom:5px}
.fld input,.fld select{width:100%}
.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:min(400px,94vw);padding:28px;background:linear-gradient(180deg,rgba(11,40,87,.92),rgba(2,6,14,.98));
  border:1px solid rgba(226,191,106,.35);border-radius:22px;box-shadow:0 28px 70px rgba(0,0,0,.65),0 0 0 1px rgba(222,30,49,.12)}
.audit{max-height:420px;overflow:auto;font-size:12.5px}
.audit div{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;gap:10px}
.audit .t{color:var(--txt3);min-width:150px;font-variant-numeric:tabular-nums}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(24,33,45,.97);
  border:1px solid var(--line2);border-radius:12px;padding:10px 18px;z-index:99;font-size:13.5px}
.toast.ok{border-color:rgba(46,204,113,.5);color:#8ff0bb}
.toast.err{border-color:rgba(255,90,95,.5);color:#ffa4a7}
.switch{width:44px;height:24px;border-radius:999px;background:#33404f;position:relative;cursor:pointer;flex:0 0 auto;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:linear-gradient(90deg,#3dd68c,#12a35c)}
.switch.on::after{left:23px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var API='/papi';
var TOKEN=localStorage.getItem('gu9_admin_token')||'';
var TAB=localStorage.getItem('gu9_admin_tab')||'dash';
var usersPage=1, usersQ='', usersSize=20, usersTotal=0, cfg=null;
/* ★ 任务奖励后台配置：任务 id → 展示名。
   只用于后台界面显示，与前端 core.js 的 S.tasks 一一对应（改名字要两边一起改）。 */
/* ★ 2026-10-03（用户要求）：任务只保留「每日签到」，8 条每日 / 成长任务全部下线。
   这里清空 = 后台不再显示任务奖励输入框，保存时 rewards 也恒为空表。 */
var TASK_NAMES={};

function $(s,root){
  root=root||document;
  /* ★ 配置项 id 里带小数点（f-think.min / f-pay.limits.perTxMax）——
     '#f-think.min' 在 CSS 选择器里会被当成「id=f-think 且 class=min」而找不到元素。
     所以 #xxx 一律先走 getElementById，再退回属性选择器。 */
  if(s.charAt(0)==='#'){
    var id=s.slice(1);
    var el=(root.getElementById?root.getElementById(id):null)||root.querySelector('[id="'+id+'"]');
    if(el)return el;
  }
  return root.querySelector(s);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"'`]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]})}
function fmt(n){return (Math.round(n)||0).toLocaleString('zh-CN')}
function ts(t){var d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function p2(n){return n<10?'0'+n:''+n}
function toast(msg,kind){var el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;
  document.body.appendChild(el);setTimeout(function(){el.remove()},2200)}
async function api(p,opt){
  opt=opt||{};
  var h={'Content-Type':'application/json'};
  if(TOKEN)h.Authorization='Bearer '+TOKEN;
  var r=await fetch(API+p,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  var j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&p.indexOf('/admin/')>=0){TOKEN='';localStorage.removeItem('gu9_admin_token');render();throw new Error('会话过期');}
  return {code:r.status,j:j||{}};
}

/* ---------------- 登录 ---------------- */
function renderLogin(msg){
  $('#app').innerHTML='<div class="login-wrap"><div class="login-box">'+
    '<div class="row" style="margin-bottom:18px"><img src="/assets/logo-mark.png" style="width:34px;height:36px;object-fit:contain" onerror="this.style.display=\'none\'">'+
    '<div><div style="font-weight:800;font-size:17px">GU9 Admin</div><div class="muted" style="font-size:12px">Navy · Crimson · Gold · server-auth</div></div></div>'+
    '<div class="fld"><label>管理员账号</label><input id="lg-u" autocomplete="username" placeholder="admin"></div>'+
    '<div class="fld"><label>口令</label><input id="lg-p" type="password" autocomplete="current-password" placeholder="请输入后台口令"></div>'+
    (msg?'<div style="color:#ffa4a7;font-size:12.5px;margin-bottom:10px">'+esc(msg)+'</div>':'')+
    '<button class="btn gold" style="width:100%;height:42px" id="lg-go">登 录</button>'+
    '<div class="muted" style="font-size:11.5px;margin-top:12px">连续输错 10 次将锁定该 IP 5 分钟</div>'+
    '</div></div>';
  $('#lg-go').onclick=doLogin;
  $('#lg-p').onkeydown=function(e){if(e.key==='Enter')doLogin()};
}
async function doLogin(){
  var u=$('#lg-u').value.trim(),p=$('#lg-p').value;
  if(!u||!p){toast('请填写账号和口令','err');return}
  try{
    var r=await api('/admin/login',{method:'POST',body:{user:u,pwd:p}});
    if(r.code===200&&r.j.token){TOKEN=r.j.token;localStorage.setItem('gu9_admin_token',TOKEN);render();toast('登录成功','ok')}
    else toast(r.j.msg||('登录失败 '+r.code),'err');
  }catch(e){renderLogin('网络错误：'+e.message)}
}

/* ---------------- 主框架 ---------------- */
function render(){
  if(!TOKEN)return renderLogin();
  /* 老版本 localstorage 里可能留着已下线的页签名 → 回落到概览，避免空白页 */
  var TABS=['dash','orders','wd','users','clubs','rooms','hands','ledger','tickets','reports','mails','mecontent','risk','ai','banner','config','bots','audit','chain'];
  if(TABS.indexOf(TAB)<0)TAB='dash';
  var TABDEF=[['dash','概览'],['orders','订单'],['wd','提现审核'],['users','用户'],['clubs','俱乐部'],['rooms','房间'],['hands','牌局'],
    ['ledger','USDT流水'],['tickets','工单'],['reports','举报'],['mails','邮件公告'],['mecontent','Me内容'],
    ['risk','风控'],['ai','AI 与透视'],['banner','Banner'],['config','参数配置'],['bots','机器人收支'],['chain','USDT 收款'],['audit','日志']];
  $('#app').innerHTML=
    '<div class="top"><div class="brand"><img src="/assets/logo-mark.png" onerror="this.style.display=\'none\'"><span>GU9 Admin</span></div>'+
    '<span class="muted" style="font-size:12px">/padmin · 服务端鉴权</span><div class="spacer"></div>'+
    '<button class="btn ghost sm" id="btn-out">退出</button></div>'+
    '<div class="tabs" style="flex-wrap:wrap">'+
      TABDEF.map(function(t){
        return '<div class="tab'+(TAB===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</div>'}).join('')+
    '</div><div class="body" id="view"><div class="muted">加载中…</div></div>';
  $('#btn-out').onclick=function(){api('/admin/logout',{method:'POST'});TOKEN='';localStorage.removeItem('gu9_admin_token');renderLogin()};
  document.querySelectorAll('[data-tab]').forEach(function(el){el.onclick=function(){TAB=el.dataset.tab;localStorage.setItem('gu9_admin_tab',TAB);render()}});
  var LOAD={dash:loadDash,orders:loadOrders,wd:loadWithdraws,users:loadUsers,clubs:loadClubs,rooms:loadRooms,hands:loadHands,
    ledger:loadLedger,tickets:loadTickets,reports:loadReports,mails:loadMails,mecontent:loadMeContent,
    risk:loadRisk,ai:loadAi,banner:loadBanner,config:loadConfig,bots:loadBots,audit:loadAudit,chain:loadChain};
  (LOAD[TAB]||loadDash)();
}

/* ---------------- 概览（2026-10-02 重写：只看 8 个数字是不够运营的） ---------------- */
async function loadDash(){
  var r=await api('/admin/extra/overview');
  if(r.code!==200){$('#view').innerHTML='<div class="card">加载失败：'+esc(r.j.msg||r.code)+'</div>';return}
  var s=r.j.stat,ret=r.j.retention,tr=r.j.trend;
  var dr=await api('/admin/extra/dailystats?days=14');
  var DS=(dr.code===200&&dr.j)?dr.j:{rows:[],today:{},last7:{},totals:{}};
  var f2=function(v){return (Math.round((+v||0)*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})};
  var sg=function(v){return ((+v||0)>=0?'+':'')+f2(v)};
  var ncls=function(v){return (+v||0)>=0?'#7fe3a8':'#ffa4a7'};
  var maxV=1;tr.forEach(function(d){if(d.hands>maxV)maxV=d.hands});
  $('#view').innerHTML=
    '<div class="grid g4">'+
      kpi(s.users,'注册用户')+kpi(s.newToday,'今日新增')+kpi(s.activeToday,'今日活跃')+kpi(s.banned,'封禁中')+
      kpi(fmt(s.handsToday),'今日手数')+kpi(fmt(s.rakeToday),'今日抽水')+kpi(fmt(s.rake7),'近 7 日抽水')+
      kpi(s.depositUsdt+' USDT','累计充值')+kpi(s.withdrawUsdt+' USDT','累计提现')+kpi(s.usdtPending+' USDT','待出款')+
      kpi(fmt(s.chipsTotal),'USDT 存量')+kpi(fmt(s.cashableTotal),'可兑现池')+
      kpi(s.roomsActive+' / '+s.rooms,'活跃房间 / 总数')+kpi(s.ticketsOpen,'待处理工单')+
      kpi(s.reportsOpen,'待处理举报')+kpi(s.riskUsers,'风控标记用户')+kpi(sg((DS.today&&DS.today.platformNet)||0),'今日平台净利（USDT）')+kpi(sg((DS.last7&&DS.last7.platformNet)||0),'近 7 日平台净利（USDT）')+kpi(f2((DS.last7&&DS.last7.rake)||0),'近 7 日抽水（USDT）')+kpi(sg((DS.last7&&DS.last7.botNet)||0),'近 7 日机器人净（USDT）')+
    '</div>'+
    '<div class="grid g3" style="margin-top:12px">'+
      '<div class="card"><div style="font-weight:700;margin-bottom:10px">留存率（当天注册 → 今日仍活跃）</div>'+
        '<table><tbody>'+
        '<tr><td class="muted">次日留存 D1</td><td class="mono">'+ret.d1.rate+'%</td><td class="muted">'+ret.d1.back+' / '+ret.d1.size+' 人</td></tr>'+
        '<tr><td class="muted">7 日留存 D7</td><td class="mono">'+ret.d7.rate+'%</td><td class="muted">'+ret.d7.back+' / '+ret.d7.size+' 人</td></tr>'+
        '<tr><td class="muted">30 日留存 D30</td><td class="mono">'+ret.d30.rate+'%</td><td class="muted">'+ret.d30.back+' / '+ret.d30.size+' 人</td></tr>'+
        '</tbody></table></div>'+
      '<div class="card" style="grid-column:span 2"><div style="font-weight:700;margin-bottom:10px">近 14 日趋势（手数 / 新增 / 活跃）</div>'+
        '<div style="display:flex;align-items:flex-end;gap:4px;height:120px;padding:6px 2px;border-bottom:1px solid var(--line)">'+
        tr.map(function(d){
          var h=Math.max(2,Math.round(d.hands/maxV*96));
          return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px" title="'+d.day+'：手数 '+d.hands+' · 抽水 '+fmt(d.rake)+' · 新增 '+d.users+' · 活跃 '+d.active+'">'+
            '<div style="width:70%;background:linear-gradient(180deg,#eed79a,var(--gold2));border-radius:4px 4px 0 0;height:'+h+'px"></div>'+
            '<div class="muted" style="font-size:9.5px">'+d.day.slice(3)+'</div></div>'}).join('')+
        '</div>'+
        '<div class="muted" style="font-size:11.5px;margin-top:8px">鼠标悬停查看当日明细 · 活跃 = 当日有登录行为的账号</div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:12px"><div style="font-weight:700;margin-bottom:4px">每日净利润（近 14 日 · 服务端权威）</div>'+
      '<div class="muted" style="font-size:11.5px;margin-bottom:10px">口径：<b>平台净利 = 抽水 + 机器人净 + 提现手续费 + 人工调账</b>；数据由服务端每手结算时按自然日入账，不依赖前端上报，纯机器人桌的抽水也计入。充值 / 提现是玩家资金进出，不计入利润，仅作参考。</div>'+
      '<div style="overflow:auto"><table><thead><tr><th>日期</th><th>手数</th><th>抽水</th><th>机器人净</th><th>提现手续费</th><th>人工调账</th><th>平台净利</th><th>充值</th><th>提现</th></tr></thead><tbody>'+
      ((DS.rows&&DS.rows.length)?DS.rows.slice().reverse().map(function(x){
        return '<tr><td class="muted">'+esc(x.day)+'</td><td class="mono">'+x.hands+'</td>'+
          '<td class="mono">'+f2(x.rake)+'</td>'+
          '<td class="mono" style="color:'+ncls(x.botNet)+'">'+sg(x.botNet)+'</td>'+
          '<td class="mono">'+f2(x.fee)+'</td>'+
          '<td class="mono" style="color:'+ncls(x.adjust)+'">'+sg(x.adjust)+'</td>'+
          '<td class="mono" style="color:'+ncls(x.platformNet)+';font-weight:700">'+sg(x.platformNet)+'</td>'+
          '<td class="mono muted">'+f2(x.deposit)+'</td><td class="mono muted">'+f2(x.withdraw)+'</td></tr>';
      }).join(''):'<tr><td colspan="9" class="muted">暂无数据</td></tr>')+
      '</tbody></table></div></div>'+
      '<div class="card" style="margin-top:12px"><div style="font-weight:700;margin-bottom:10px">常用操作</div>'+
      '<div class="row" style="flex-wrap:wrap">'+
        '<button class="btn gold sm" id="d-sweep">清理僵尸房（24h 无活动）</button>'+
        '<button class="btn sm" id="d-backup">立即备份数据</button>'+
        '<button class="btn ghost sm" id="d-export-u">导出用户 CSV</button>'+
        '<button class="btn ghost sm" id="d-export-o">导出订单 CSV</button>'+
        '<button class="btn ghost sm" id="d-export-h">导出牌局 CSV</button>'+
        '<button class="btn ghost sm" id="d-export-l">导出USDT流水 CSV</button>'+
      '</div>'+
      '<div class="muted" style="font-size:12px;margin-top:10px">'+
      '★ 资金口径：<b>站内余额即 USDT（1 USDT = 1 USDT，两位小数）</b>，无「筹码 / 分」概念；<b>可兑现池 cashable</b> 为亏损风控口径下的可提现上限。'+
      '★ 充值通道 TRC20 / ERC20(以太坊) / SOL(Solana) 链上到账；提现由运营方链上出款并回填 TXID（服务端无私钥）。<br>'+
      '数据每 30 秒自动刷新 · 所有后台操作写入 audit.log（带 role 分流，见「日志」页）</div></div>';
  $('#d-sweep').onclick=async function(){
    if(!confirm('清理所有超过 24 小时没有活动的房间？'))return;

var ordStatus='',ordQ='',ordPage=1;

function orderBtns(o){
  var id=o.id,b=[];
  if(o.status==='pending'){
    b.push('<button class="btn sm gold" data-ord="'+id+'" data-op="approve">'+(o.type==='withdraw'?'风控通过':'审核通过')+'</button>');
    b.push('<button class="btn sm ghost" data-ord="'+id+'" data-op="freeze">冻结</button>');
    b.push('<button class="btn sm red" data-ord="'+id+'" data-op="reject">驳回</button>');
  }else if(o.status==='frozen'){
    b.push('<button class="btn sm gold" data-ord="'+id+'" data-op="approve">放行</button>');
    b.push('<button class="btn sm ghost" data-ord="'+id+'" data-op="freeze">解冻</button>');
    b.push('<button class="btn sm red" data-ord="'+id+'" data-op="reject">驳回</button>');
  }else if(o.status==='approved'){
    b.push('<button class="btn sm green" data-ord="'+id+'" data-op="approve">'+(o.type==='withdraw'?'出款完成':'确认到账')+'</button>');
    b.push('<button class="btn sm red" data-ord="'+id+'" data-op="reject">驳回</button>');
  }else if(o.status==='rejected'&&o.type==='withdraw'){
    b.push('<button class="btn sm ghost" data-ord="'+id+'" data-op="refund">退回USDT</button>');
  }else{
    b.push('<span class="muted">—</span>');
  }
  return b.join(' ');
}

async function doOrder(id,op){
  var label={approve:'确认执行该状态流转？',reject:'确定驳回该订单？（提现的冻结USDT可随后退回）',freeze:'确定冻结 / 解冻该订单？',refund:'确定把冻结的USDT退回给玩家？'}[op]||'确定执行？';

  if(n==='ERC20'||n==='ETH')return 'https://etherscan.io/address/'+addr;

/* 把选中的 Logo 压到 ≤512px（保留透明通道 → PNG），返回 dataURL 和一句尺寸说明 */
function logoCompress(file,cb){
  var rd=new FileReader();
  rd.onerror=function(){cb(null,'')};
  rd.onload=function(){
    var img=new Image();
    img.onerror=function(){cb(null,'')};
    img.onload=function(){
      var W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
      if(!W||!H){cb(null,'');return}
      var MAX=512,w=W,h=H;
      if(w>MAX||h>MAX){var k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
      var cv=document.createElement('canvas');
      cv.width=w;cv.height=h;
      var cx=cv.getContext('2d');
      cx.clearRect(0,0,w,h);
      try{cx.drawImage(img,0,0,w,h)}catch(e){cb(null,'');return}
      /* 先试 PNG（保透明），太大再退 JPEG —— 服务端上限 2MB */
      var out=cv.toDataURL('image/png');
      if(out.length>1.6*1024*1024) out=cv.toDataURL('image/jpeg',0.9);
      cb(out,W+'×'+H+' → '+w+'×'+h);
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

/* CSV 导出：必须用 fetch 带上 Authorization（location.href 带不了请求头，会被 401 拦下） */
async function download(type){
  try{
    var r=await fetch(API+'/admin/extra/export?type='+type,{headers:{'Authorization':'Bearer '+TOKEN}});
    if(r.status!==200){toast('导出失败 '+r.status,'err');return}
    var b=await r.blob(),url=URL.createObjectURL(b),a=document.createElement('a');
    a.href=url;a.download=type+'-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    toast('已导出 '+type,'ok');
  }catch(e){toast('导出失败：'+e.message,'err')}
}

/* 把选中的图片压到 ≤2360px 宽、JPEG 0.85，返回 dataURL 和一句尺寸说明 */
function bannerCompress(file,cb){
  var rd=new FileReader();
  rd.onerror=function(){cb(null,'')};
  rd.onload=function(){
    var img=new Image();
    img.onerror=function(){cb(null,'')};
    img.onload=function(){
      var W=img.naturalWidth||img.width, H=img.naturalHeight||img.height;
      if(!W||!H){cb(null,'');return}
      var MAXW=2360, MAXH=1200;
      var w=W, h=H;
      if(w>MAXW){h=Math.round(h*MAXW/w);w=MAXW}
      if(h>MAXH){w=Math.round(w*MAXH/h);h=MAXH}
      var cv=document.createElement('canvas');
      cv.width=w;cv.height=h;
      var cx=cv.getContext('2d');
      cx.fillStyle='#101720';cx.fillRect(0,0,w,h);
      try{cx.drawImage(img,0,0,w,h)}catch(e){cb(null,'');return}
      var out=cv.toDataURL('image/jpeg',0.85);
      cb(out,W+'×'+H+' → '+w+'×'+h);
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
function addBanner(url){
  if(!url){toast('请先上传一张图片','err');return}
  if(BAN.list.some(function(b){return b.img===url})){toast('这张图已在轮播列表里','err');return}
  BAN.list.push({id:'b'+Date.now().toString(36),img:url,t:'',s:'',act:'',on:true});
  markFileUsed();drawFiles();drawBanners();
}
/* 轮播列表变了 → 同步「已上传图片」上的「轮播中」标记 */

  var m={};

  BAN.files.forEach(function(f){f.used=!!m[f.name]});
}

  });
}

/* ---------------- USDT 链上收款：地址簿 + 入账监控 ---------------- */
var chainOnly='';
async function loadChain(){
  var r=await api('/admin/extra/addr');
  if(r.code!==200){$('#view').innerHTML='<div class="card">加载失败：'+esc(r.j.msg||r.code)+'</div>';return}
  var list=r.j.list||[],c=r.j.chain||{},g=c.cfg||{},st=c.stats||{},last=c.last||{};
  var d=await api('/admin/extra/deposits?limit=60&only='+chainOnly);
  var deps=(d.code===200&&d.j.list)||[];

  $('#view').innerHTML=
    '<div class="grid g4">'+
      kpi(st.addrs||0,'收款地址总数')+kpi(st.enabled||0,'启用中')+
      kpi(st.deps||0,'已扫到入账')+kpi(st.unmatched||0,'待认领入账')+
      kpi(st.matched||0,'已自动到账')+kpi(c.running?'运行中':'已停止','监控状态')+
    '</div>'+

    /* ---- 监控配置 ---- */
    '<div class="card" style="margin-top:12px"><div style="font-weight:700;margin-bottom:10px">链上监控</div>'+
      '<div class="muted" style="font-size:12px;margin-bottom:10px">轮询公共区块浏览器扫描 USDT 入账，命中「地址 + 金额 + 时间窗 + 确认数」后自动把USDT打到玩家账户，并同步抬升可兑现池。'+
      '<b>本服务只读链上数据，不持有私钥、不发起任何转账。</b></div>'+
      '<div class="row" style="margin-bottom:10px"><span style="font-size:12.5px">总开关</span><div class="switch'+(g.on?' on':'')+'" id="c-on"></div>'+
        '<span class="muted" style="font-size:12px">当前：'+(c.running?'<b style="color:#2ecc71">运行中</b>':'<b class="muted">已停止</b>')+'</span></div>'+
      '<div class="row" style="margin-bottom:10px"><span style="font-size:12.5px">自动到账</span><div class="switch'+(g.autoCredit?' on':'')+'" id="c-auto"></div>'+
        '<span class="muted" style="font-size:12px">关掉则只记录入账，需人工点「补单」</span></div>'+
      '<div class="grid g4">'+
        '<div class="fld"><label>轮询间隔（毫秒，最小 10000）</label><input id="c-poll" type="number" value="'+esc(g.pollMs||30000)+'"></div>'+
        '<div class="fld"><label>确认数（留空 = 按各链默认）</label><input id="c-conf" type="number" value="'+esc(g.minConf==null?'':g.minConf)+'" placeholder="默认"></div>'+
        '<div class="fld"><label>金额容差（0.005 = 0.5%）</label><input id="c-tol" type="number" step="0.001" value="'+esc(g.tolerance==null?0.005:g.tolerance)+'"></div>'+
        '<div class="fld"><label>订单有效期（分钟）</label><input id="c-win" type="number" value="'+esc(g.windowMin||60)+'"></div>'+
        '<div class="fld"><label>每次回扫（小时）</label><input id="c-hours" type="number" value="'+esc(g.scanHours||24)+'"></div>'+
        '<div class="fld"><label>TRON API Key（可选）</label><input id="c-ktron" value="'+(g.keys&&g.keys.tron?'已设置':'')+'" placeholder="留空走公共限额"></div>'+
        '<div class="fld"><label>Etherscan API Key（可选）</label><input id="c-kevm" value="'+(g.keys&&g.keys.evm?'已设置':'')+'" placeholder="留空走公共限额"></div>'+
        '<div class="fld"><label>Solana RPC（可选）</label><input id="c-ksol" value="'+(g.keys&&g.keys.sol?'已设置':'')+'" placeholder="留空用公共 RPC"></div>'+
      '</div>'+
      '<div class="row" style="margin-top:10px"><button class="btn gold" id="c-save">保存配置</button>'+
        '<button class="btn sm" id="c-scan">立即扫描一次</button>'+
        '<span class="muted" style="font-size:12px">上次扫描：'+(last.at?ts(last.at)+' · 新入账 '+(last.scanned||0)+' · 到账 '+(last.matched||0):'—')+
        (last.err?' · <b style="color:#ff8a8d">'+esc(last.err)+'</b>':'')+'</span></div>'+
    '</div>'+

    /* ---- 地址簿 ---- */
    '<div class="card" style="margin-top:12px"><div style="font-weight:700;margin-bottom:10px">收款地址簿</div>'+
      '<div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">'+
        /* ★ 2026-10-08：新增以太坊(ERC20) + Solana(SOL)，与 server.js PAY_DEFAULT.nets 一致 */
        '<select id="a-net">'+['TRC20','ERC20','SOL'].map(function(n){
          return '<option value="'+n+'">'+n+'</option>'}).join('')+'</select>'+
        '<input id="a-addr" placeholder="收款地址" style="flex:1;min-width:220px">'+
        '<input id="a-label" placeholder="备注（如：主收-1）" style="width:180px">'+
        '<button class="btn gold sm" id="a-add">添加地址</button>'+
      '</div>'+
      '<div class="muted" style="font-size:11.5px;margin-bottom:8px">'+
        (c.nets||[]).map(function(n){return '<b>'+n.net+'</b>（确认 '+n.minConf+'）· '+esc(n.note)}).join(' &nbsp;|&nbsp; ')+
      '</div>'+
      (list.length?'<table><thead><tr><th>ID</th><th>网络</th><th>地址</th><th>备注</th><th>状态</th>'+
        '<th>已用</th><th>累计入账</th><th>最近入账</th><th>操作</th></tr></thead><tbody>'+
        list.map(function(a){
          return '<tr><td class="mono">'+esc(a.id)+'</td><td>'+esc(a.net)+'</td>'+
            '<td class="mono" style="font-size:11.5px;word-break:break-all;max-width:220px">'+esc(a.address)+'</td>'+
            '<td>'+esc(a.label||'')+'</td>'+
            '<td><span class="tag '+(a.enabled?'ok':'off')+'">'+(a.enabled?'启用':'停用')+'</span></td>'+
            '<td class="mono">'+esc(a.used||0)+'</td><td class="mono">'+esc(a.totalUsdt||0)+' USDT</td>'+
            '<td class="muted">'+(a.lastTs?ts(a.lastTs):'—')+'</td>'+
            '<td><button class="btn ghost sm" data-tog="'+esc(a.id)+'">'+(a.enabled?'停用':'启用')+'</button> '+
            '<button class="btn ghost sm" data-del="'+esc(a.id)+'">删除</button></td></tr>'}).join('')+
        '</tbody></table>':'<div class="muted">还没有收款地址 —— 先添加一个，玩家充值才能拿到地址。</div>')+
    '</div>'+

    /* ---- 入账流水 ---- */
    '<div class="card" style="margin-top:12px"><div class="row" style="margin-bottom:10px">'+
      '<div style="font-weight:700">链上入账</div><div style="flex:1"></div>'+
      '<select id="d-only">'+
        [['','全部'],['unmatched','仅待认领'],['matched','仅已到账']].map(function(t){
          return '<option value="'+t[0]+'"'+(chainOnly===t[0]?' selected':'')+'>'+t[1]+'</option>'}).join('')+'</select></div>'+
      (deps.length?'<table><thead><tr><th>时间</th><th>网络</th><th>入账地址</th><th>金额</th><th>确认</th><th>归属</th><th>操作</th></tr></thead><tbody>'+
        deps.map(function(x){
          return '<tr><td class="muted">'+ts(x.ts)+'</td><td>'+esc(x.net)+'</td>'+
            '<td class="mono" style="font-size:11px">'+esc(String(x.address||'').slice(0,14))+'…</td>'+
            '<td class="mono"><b>'+esc(x.amount)+'</b> USDT</td>'+
            '<td class="mono">'+esc(x.conf||0)+'</td>'+
            '<td>'+(x.orderId?'<span class="tag ok">'+esc(x.orderId)+'</span> · '+esc(x.user||'')+' +'+fmt(x.credited||0):
                    '<span class="tag wait">待认领</span>'+(x.failMsg?' '+esc(x.failMsg):''))+'</td>'+
            '<td>'+(x.orderId?'<span class="muted">TX '+esc(String(x.txid||'').slice(0,10))+'…</span>':
              '<input placeholder="订单号" data-claim="'+esc(x.id)+'" style="width:92px"> <button class="btn ghost sm" data-do-claim="'+esc(x.id)+'">补单</button>')+
            '</td></tr>'}).join('')+'</tbody></table>':'<div class="muted">暂无入账记录</div>')+
    '</div>';

  var st2={on:!!g.on,auto:g.autoCredit!==false};
  $('#c-on').onclick=function(){st2.on=!st2.on;this.classList.toggle('on',st2.on)};
  $('#c-auto').onclick=function(){st2.auto=!st2.auto;this.classList.toggle('on',st2.auto)};
  $('#c-save').onclick=async function(){
    var keys={};
    var kt=$('#c-ktron').value.trim(), ke=$('#c-kevm').value.trim(), ks=$('#c-ksol').value.trim();
    if(kt&&kt!=='已设置')keys.tron=kt;
    if(ke&&ke!=='已设置')keys.evm=ke;
    if(ks&&ks!=='已设置')keys.sol=ks;
    var x=await api('/admin/extra/chain',{method:'POST',body:{
      on:st2.on,autoCredit:st2.auto,
      pollMs:+$('#c-poll').value,minConf:$('#c-conf').value===''?null:+$('#c-conf').value,
      tolerance:+$('#c-tol').value,windowMin:+$('#c-win').value,scanHours:+$('#c-hours').value,keys:keys}});
    toast(x.code===200?'已保存':'失败：'+(x.j.msg||x.code),x.code===200?'ok':'err');
    if(x.code===200)loadChain();
  };
  $('#c-scan').onclick=async function(){
    this.textContent='扫描中…';
    var x=await api('/admin/extra/chain/scan',{method:'POST',body:{}});
    toast(x.code===200?('完成：新入账 '+(x.j.scanned||0)+' · 到账 '+(x.j.matched||0)+(x.j.err?' · '+x.j.err:'')):'失败：'+(x.j.msg||x.code),x.code===200?'ok':'err');
    loadChain();
  };
  $('#a-add').onclick=async function(){
    var a=$('#a-addr').value.trim();
    if(!a)return toast('请填写收款地址','err');
    var x=await api('/admin/extra/addr/add',{method:'POST',body:{net:$('#a-net').value,address:a,label:$('#a-label').value}});
    toast(x.code===200?'已添加':'失败：'+(x.j.msg||x.code),x.code===200?'ok':'err');
    if(x.code===200)loadChain();
  };
  document.querySelectorAll('[data-tog]').forEach(function(b){b.onclick=async function(){
    var en=b.textContent==='启用';
    var x=await api('/admin/extra/addr/update',{method:'POST',body:{id:this.dataset.tog,enabled:en}});
    if(x.code!==200)toast('失败：'+(x.j.msg||x.code),'err');loadChain();
  }});
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=async function(){
    if(!confirm('确定删除这个收款地址？已产生的订单不受影响，但不会再有新订单分配到它。'))return;
    var x=await api('/admin/extra/addr/del',{method:'POST',body:{id:this.dataset.del}});
    if(x.code!==200)toast('失败：'+(x.j.msg||x.code),'err');loadChain();
  }});
  document.querySelectorAll('[data-do-claim]').forEach(function(b){b.onclick=async function(){
    var inp=document.querySelector('[data-claim="'+this.dataset.doClaim+'"]');
    var oid=(inp&&inp.value||'').trim();
    if(!oid)return toast('请填写订单号','err');
    if(!confirm('把这笔入账补到订单 '+oid+' 并立即给玩家加USDT？'))return;
    var x=await api('/admin/extra/deposits/claim',{method:'POST',body:{depId:this.dataset.doClaim,orderId:oid}});
    toast(x.code===200?('已补单，到账 '+fmt(x.j.usdt||0)+' USDT'):'失败：'+(x.j.msg||x.code),x.code===200?'ok':'err');
    if(x.code===200)loadChain();
  }});
  $('#d-only').onchange=function(){chainOnly=this.value;loadChain()};
}

/* ---------------- 审计（role 分流：管理员操作 vs 玩家行为） ---------------- */
var auditRole='';
async function loadAudit(){
  var r=await api('/admin/audit?limit=200');
  if(r.code!==200){$('#view').innerHTML='<div class="card">加载失败</div>';return}
  var all=r.j.list||[];
  var list=all.filter(function(a){return !auditRole||auditRole==='all'||(a.role||'user')===auditRole});
  $('#view').innerHTML='<div class="card">'+
    '<div class="row" style="margin-bottom:10px">'+
      '<b style="font-size:13px">操作日志</b>'+
      '<select id="ad-role">'+
        [['all','全部'],['admin','仅管理员操作'],['user','仅玩家行为']].map(function(t){
          return '<option value="'+t[0]+'"'+(auditRole===t[0]?' selected':'')+'>'+t[1]+'</option>'}).join('')+'</select>'+
      '<div class="spacer" style="flex:1"></div><span class="muted">共 '+list.length+' / '+all.length+' 条</span>'+
    '</div><div class="audit">'+
    (list.length?list.map(function(a){
      var isAdmin=(a.role==='admin');
      return '<div><span class="t">'+ts(a.ts)+'</span>'+
        '<span class="tag '+(isAdmin?'wait':'off')+'" style="min-width:56px;text-align:center">'+(isAdmin?'管理员':'玩家')+'</span>'+
        '<span class="mono" style="min-width:120px">'+esc(a.action)+'</span>'+
        '<span class="mono muted">'+esc(a.admin||'')+'</span>'+
        '<span>'+esc(a.detail||'')+'</span>'+
        '<span class="muted" style="margin-left:auto">'+esc(a.target||'')+'</span>'+
        '<span class="muted" style="min-width:110px;text-align:right">'+esc(a.ip||'')+'</span></div>'
    }).join(''):'<div class="muted">暂无记录</div>')+'</div></div>';
  $('#ad-role').onchange=function(){auditRole=this.value;loadAudit()};
}

/* 启动：先验证会话是否有效 */
(async function(){
  if(!TOKEN)return renderLogin();
  try{
    var r=await api('/admin/me');
    if(r.code===200)render();else renderLogin();
  }catch(e){renderLogin()}
})();
</script>
